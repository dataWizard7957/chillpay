[project]
name = "chill-pay"
version = "0.1.0"
description = "Local-first payroll and invoice management."
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy==2.0.25",
    "alembic==1.20.0",
    "reportlab==5.0.1",
    "fastapi==0.128.0",
    "starlette==0.50.0",
    "uvicorn==0.40.0",
    "python-dotenv==1.2.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
